[project]
name = "plotsalot"
version = "0.1.1"
description = "Statistical visualizations and distribution diagnostics for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Myers" }]
keywords = [
    "statistics",
    "visualization",
    "matplotlib",
    "polars",
    "ggstatsplot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "polars>=1.44.1,<2",
    "scipy>=1.16,<2",
    "statsmodels>=0.15,<0.16",
]

[project.urls]
Homepage = "https://github.com/joshuamyers22/plotsalot"
Documentation = "https://github.com/joshuamyers22/plotsalot/tree/main/docs"
Repository = "https://github.com/joshuamyers22/plotsalot"
Issues = "https://github.com/joshuamyers22/plotsalot/issues"
Changelog = "https://github.com/joshuamyers22/plotsalot/blob/main/CHANGELOG.md"

[project.scripts]
"plotsalot" = "plotsalot.cli:main"
"plotsalot-regression" = "plotsalot.analysis_cli:main"
"plotsalot-validate" = "plotsalot.time_validation_cli:main"
"plotsalot-dataset" = "plotsalot.dataset_cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage==7.16.1",
    "jsonschema==4.25.1",
    "pyright==1.1.414",
    "ruff==0.16.5",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["plotsalot"]

[tool.coverage.report]
fail_under = 75
show_missing = true
