[project]
name = "plotsalot"
version = "0.1.0"
description = "Statistical visualizations and distribution diagnostics for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2,<3",
    "polars>=1.44.1,<2",
    "scipy>=1.16,<2",
    "statsmodels>=0.15,<0.16",
]

[project.scripts]
"plotsalot" = "plotsalot.cli:main"
"plotsalot-regression" = "plotsalot.analysis_cli:main"
"plotsalot-validate" = "plotsalot.time_validation_cli:main"
"plotsalot-dataset" = "plotsalot.dataset_cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright==1.1.411", "ruff==0.16.5"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
