name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - run: uv sync --frozen --dev
      - run: make check
      - run: make audit build

  installed-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - run: uv build --clear --no-sources
      - name: Smoke installed wheel and sdist
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          for artifact in dist/*.whl dist/*.tar.gz; do
            artifact_kind="${artifact##*.}"
            smoke_environment=".venv-package-smoke-${PYTHON_VERSION}-${artifact_kind}"
            uv venv --python "$PYTHON_VERSION" "$smoke_environment"
            uv pip install --python "$smoke_environment/bin/python" "$artifact"
            "$smoke_environment/bin/python" tools/smoke_installed.py --expected-version "$(uv version --short)"
          done
